[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# This URL is overridden at runtime by alembic/env.py which reads DATABASE_URL from environment.
# The value here is a fallback for alembic autogenerate commands run locally.
sqlalchemy.url = postgresql+asyncpg://postgres:changeme@localhost:5432/forgesdlc

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
