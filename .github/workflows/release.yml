name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

# Requires a 'production' environment in GitHub repo settings with required reviewers.

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
          POSTGRES_DB: forgesdlc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests (skip slow e2e)
        run: pytest tests/ -q -m "not slow" --tb=short
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}@localhost:5432/forgesdlc
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-minimum-32-chars-long' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}

      - name: Commercial readiness check
        run: python scripts/commercial_readiness_check.py
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}@localhost:5432/forgesdlc
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

  publish-python:
    needs: test
    runs-on: ubuntu-latest
  
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build package
        run: |
          pip install build twine
          python -m build

      # pip install forgesdlc-mcp would need name = "forgesdlc-mcp" — keeping as forgesdlc
      - name: Publish to PyPI
        run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}

  publish-npm:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install and publish npm package
        run: |
          cd electron
          npm install
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  build-electron:
    needs: test
  
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
                  artifact_path: 'electron/dist/*.exe'
            artifact_name: 'windows'
          - os: macos-latest
            platform: mac
            artifact_path: 'electron/dist/*.dmg'
            artifact_name: 'macos'
          - os: ubuntu-latest
            platform: linux
            artifact_path: 'electron/dist/*.deb'
            artifact_name: 'linux'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
              node-version: '20'

      - name: Install electron dependencies
        run: cd electron && npm install

      - name: Build Electron app
        run: cd electron && npx electron-builder --${{ matrix.platform }} --publish never

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: electron-${{ matrix.artifact_name }}
              path: ${{ matrix.artifact_path }}
          if-no-files-found: warn

  github-release:
    needs: [publish-python, publish-npm, build-electron]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: electron-*
          merge-multiple: true
          path: dist/

      - name: List release artifacts
        run: |
          echo "Release artifacts:"
          ls -la dist/ 2>/dev/null && true || echo "(no artifacts — Electron builds may have failed)"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          fail_on_unmatched_files: false
          body: |
            ## forgeSDLC ${{ github.ref_name }}

            The missing SDLC layer for your AI coding tools.

            ### Install

            ```bash
            npx @forgesdlc/agent
            # or: pip install forgesdlc
            ```

            ### Downloads
            - **Windows:** `forgesdlc-setup-${{ github.ref_name }}.exe`
            - **macOS:** `forgesdlc-${{ github.ref_name }}.dmg`
            - **Linux:** `forgesdlc-${{ github.ref_name }}.deb`

            See [CHANGELOG.md](CHANGELOG.md) for full release notes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-vscode:
    needs: github-release
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install extension dependencies
        run: cd vscode_extension && npm install

      - name: Compile TypeScript
        run: cd vscode_extension && npm run build

      - name: Publish VS Code extension
        run: cd vscode_extension && npx @vscode/vsce publish --pat ${{ secrets.VSCE_PAT }}
