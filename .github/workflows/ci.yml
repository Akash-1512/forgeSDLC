name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          # Fix P1: use a consistent CI-only password via env var (not hardcoded 'forgesdlc')
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}
          POSTGRES_DB: forgesdlc
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Fix P11: cache pip dependencies — dramatically reduces install time
      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Lint and format check
        run: ruff check . && ruff format --check .

      # Fix P12: add mypy type checking
      - name: Type check (mypy)
        run: mypy mcp_server/ orchestrator/ agents/ memory/ model_router/ --ignore-missing-imports --no-error-summary
        continue-on-error: true  # advisory — does not block merge in v1.1.0

      # Fix P19: scope semgrep to src dirs only, exclude tests and generated files
      # Fix P3: keep continue-on-error: true so findings are advisory not blocking
      - name: Security scan (semgrep)
        run: |
          semgrep --config=p/python --config=p/security \
            mcp_server/ orchestrator/ agents/ memory/ model_router/ \
            tool_router/ workspace/ context_management/ providers/ \
            subscription/ token_tracker/ interpret/ \
            --error --quiet
        continue-on-error: true

      # Fix P13: enforce 60% minimum coverage (up from nothing)
      - name: Run tests with coverage
        run: pytest tests/ -m "not slow" --tb=short -q --cov=. --cov-report=xml --cov-fail-under=60
        env:
          # Fix P1: match CI DB password
          DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}@localhost:5432/forgesdlc
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-minimum-32-chars-long' }}
          # API keys optional in CI — tests mock LLM calls
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || '' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || '' }}

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          fail_ci_if_error: false

      # Fix P17: make API key checks advisory-only in CI — secrets may not be set
      - name: Commercial readiness check
        run: python scripts/commercial_readiness_check.py
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:${{ secrets.POSTGRES_PASSWORD || 'ci_test_password' }}@localhost:5432/forgesdlc
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY || 'ci-placeholder' }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY || 'ci-placeholder' }}
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'ci-test-secret-key-minimum-32-chars-long' }}
          # CI mode: skip hard-fail on missing API keys (secrets may not be configured)
          FORGESDLC_CI: 'true'
        continue-on-error: true  # advisory in CI — hard-fail only in release
