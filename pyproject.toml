[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "forgesdlc-mcp"
version = "1.1.0"
requires-python = ">=3.12"
dependencies = [
    # MCP transport
    "fastmcp>=2.0",
    "mcp>=1.0",
    # Core
    "pydantic>=2.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "httpx-sse",
    # Database — PostgreSQL (required) + SQLite checkpointing
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    # LangGraph / LangChain
    "langgraph>=1.1.4",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "langchain-core>=0.2",
    "langchain-huggingface>=0.0.3",
    # LLM providers
    "openai>=1.66.0",
    "groq>=0.9.0",
    "google-generativeai>=0.7.0",
    # Embeddings / vector store
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",
    # Auth
    "PyJWT>=2.8.0",
    "argon2-cffi>=23.1.0",
    "keyring>=25.0.0",
    # Workspace / file watching
    "gitpython>=3.1.40",
    "watchdog>=4.0.0",
    # Observability
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-exporter-otlp>=1.25.0",
    # Utilities
    "PyYAML>=6.0",
    "tenacity>=8.2.0",
    # Security scanning — required by run_security_scan MCP tool (production)
    "bandit>=1.7.9",
    "semgrep>=1.75.0",
    "pip-audit>=2.7.0",
    "detect-secrets>=1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4.0",
    "pre-commit>=3.7",
]

[project.scripts]
forgesdlc-mcp = "mcp_server.server:main"

[tool.hatch.build.targets.wheel]
packages = [
    "mcp_server",
    "orchestrator",
    "interpret",
    "agents",
    "memory",
    "model_router",
    "tool_router",
    "workspace",
    "context_management",
    "context_files",
    "subscription",
    "token_tracker",
    "providers",
    "architecture_intelligence",
    "tools",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "TID"]

[tool.ruff.lint.per-file-ignores]
# Long lines inside triple-quoted YAML/SQL template strings cannot be split
"agents/agent_7_cicd.py" = ["E501"]
"mcp_server/shared_infrastructure.py" = ["E501"]
# Integration tests use sys.path manipulation before imports
"tests/integration/*" = ["E402"]
"scripts/mcp_test_client.py" = ["E402"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"
filterwarnings = ["error", "ignore::ResourceWarning"]
markers = [
    "slow: marks tests as slow (deselect with -m 'not slow')",
]
